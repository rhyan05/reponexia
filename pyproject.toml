[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reponexia"
version = "0.1.0"
description = "CLI que explica um repositório desconhecido"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reponexia = "reponexia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
